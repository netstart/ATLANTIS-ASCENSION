# Os testes NÃO rodam no CI: rode tools/run_checks.ps1 na sua máquina antes do push (ver AGENTS.md). No push na
# main, AAB assinado e envio ao teste fechado (alpha), pulando versionCode já enviado. Run workflow: envio a
# internal/alpha/beta, ou production promovendo a versão do alpha.
# Secrets: tools/setup_ci_secrets.ps1. Detalhes: docs/store/play-console.md ("Publicação automática").
name: Android Play

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      track:
        description: Faixa da Play (alpha = teste fechado)
        type: choice
        options: [internal, alpha, beta, production]
        default: alpha
      rollout:
        description: Fração de usuários na produção (0 a 1; 1 = completed). Só para production
        type: string
        default: '0.2'
      status:
        description: Status da versão (internal, alpha, beta)
        type: choice
        options: [completed, draft]
        default: completed

permissions:
  contents: read

concurrency:
  group: android-play-${{ github.ref }}
  cancel-in-progress: false

env:
  GODOT_DIR: C:\godot
  GODOT: C:\godot\Godot_v4.7.2-stable_win64_console.exe
  GODOT_URL: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable

jobs:
  release:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.track != 'production')
    runs-on: windows-latest
    timeout-minutes: 60
    concurrency:
      group: android-play-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Versão
        id: version
        shell: pwsh
        run: |
          $version = (Select-String project.godot -Pattern 'config/version="([^"]+)"').Matches[0].Groups[1].Value
          $code = (Select-String export_presets.cfg -Pattern '^version/code=(\d+)').Matches[0].Groups[1].Value
          "name=$version ($code)" >> $env:GITHUB_OUTPUT
          "code=$code" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install google-auth requests

      - name: versionCode já está na Play?
        id: play
        shell: pwsh
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          $exists = python tools/play_publish.py has-version $env:CODE
          if ($LASTEXITCODE -ne 0) { throw 'play_publish.py has-version falhou' }
          "exists=$exists" >> $env:GITHUB_OUTPUT
          if ($exists -eq 'true') {
            "::notice::versionCode $env:CODE já está na Play; build e envio pulados (suba version/code no export_presets.cfg)"
          }

      - uses: actions/setup-java@v6
        if: steps.play.outputs.exists == 'false'
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache do Godot 4.7.2
        id: godot-cache
        uses: actions/cache@v6
        if: steps.play.outputs.exists == 'false'
        with:
          path: |
            C:\godot
            ~\AppData\Roaming\Godot\export_templates\4.7.2.stable
          key: godot-4.7.2-stable-win64-templates

      - name: Baixar o Godot e os export templates
        if: steps.play.outputs.exists == 'false' && steps.godot-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $tmp = Join-Path $env:RUNNER_TEMP 'godot-dl'
          New-Item -ItemType Directory -Force $tmp, $env:GODOT_DIR | Out-Null
          Invoke-WebRequest "$env:GODOT_URL/Godot_v4.7.2-stable_win64.exe.zip" -OutFile "$tmp\editor.zip"
          Expand-Archive "$tmp\editor.zip" $env:GODOT_DIR -Force
          Invoke-WebRequest "$env:GODOT_URL/Godot_v4.7.2-stable_export_templates.tpz" -OutFile "$tmp\templates.zip"
          Expand-Archive "$tmp\templates.zip" $tmp -Force
          $dest = Join-Path $env:APPDATA 'Godot\export_templates\4.7.2.stable'
          New-Item -ItemType Directory -Force $dest | Out-Null
          Move-Item "$tmp\templates\*" $dest -Force
          if (-not (Test-Path $env:GODOT)) { throw "Godot não encontrado em $env:GODOT" }

      - name: Android SDK e configurações do editor
        if: steps.play.outputs.exists == 'false'
        shell: pwsh
        run: |
          $sdk = if ($env:ANDROID_HOME) { $env:ANDROID_HOME } else { $env:ANDROID_SDK_ROOT }
          & "$sdk\cmdline-tools\latest\bin\sdkmanager.bat" --sdk_root=$sdk 'platform-tools' 'platforms;android-36' 'build-tools;36.1.0'
          if ($LASTEXITCODE -ne 0) { throw 'sdkmanager falhou' }
          $settings = @"
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$($env:JAVA_HOME -replace '\\', '/')"
          export/android/android_sdk_path = "$($sdk -replace '\\', '/')"
          "@
          Set-Content (Join-Path $env:APPDATA 'Godot\editor_settings-4.7.tres') $settings -Encoding utf8NoBOM

      - name: Chave de upload
        if: steps.play.outputs.exists == 'false'
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          $keystore = Join-Path $env:RUNNER_TEMP 'upload.keystore'
          [IO.File]::WriteAllBytes($keystore, [Convert]::FromBase64String($env:KEYSTORE_BASE64))
          @(
            "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$keystore"
            "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$env:KEYSTORE_ALIAS"
            "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$env:KEYSTORE_PASSWORD"
          ) | Set-Content (Join-Path $env:RUNNER_TEMP 'upload.env') -Encoding utf8NoBOM

      - name: AAB de release
        if: steps.play.outputs.exists == 'false'
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File tools\build_release.ps1 -Godot $env:GODOT -KeyEnv "$env:RUNNER_TEMP\upload.env" -Java $env:JAVA_HOME -PlayOnly

      - name: Apagar a chave do runner
        if: always()
        shell: pwsh
        run: Remove-Item "$env:RUNNER_TEMP\upload.keystore", "$env:RUNNER_TEMP\upload.env" -Force -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v7
        if: steps.play.outputs.exists == 'false'
        with:
          name: atlantis-ascension-release-aab
          path: build/atlantis-ascension-release.aab

      - name: Enviar para a Google Play
        if: steps.play.outputs.exists == 'false'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.github.netstart.atlantisascension
          releaseFiles: build/atlantis-ascension-release.aab
          tracks: ${{ inputs.track || 'alpha' }}
          status: ${{ inputs.status || 'completed' }}
          releaseName: ${{ steps.version.outputs.name }}

  promote:
    if: github.event_name == 'workflow_dispatch' && inputs.track == 'production'
    runs-on: windows-latest
    timeout-minutes: 10
    concurrency:
      group: android-play-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install google-auth requests

      - name: Promover o teste fechado (alpha) para a produção
        shell: pwsh
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          ROLLOUT: ${{ inputs.rollout }}
        run: |
          python tools/play_publish.py promote --from alpha --to production --fraction $env:ROLLOUT
          if ($LASTEXITCODE -ne 0) { throw 'play_publish.py promote falhou' }
